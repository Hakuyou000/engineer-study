<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 780" width="720" height="780" role="img" aria-labelledby="t">
<title id="t">VPC の全体像(3 層構成: ALB、アプリ、データベースを別のサブネットに置く)</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a666b"/></marker></defs>
<g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="14" fill="#1c2427">
<rect x="270" y="8" width="180" height="32" rx="16" fill="#eef2f7" stroke="#5a666b" stroke-width="2"/>
<text x="360" y="29" text-anchor="middle">インターネット</text>
<line x1="360" y1="40" x2="360" y2="90" stroke="#5a666b" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="10" y="64" width="700" height="630" rx="10" fill="#ffffff" stroke="#5a666b" stroke-width="2"/>
<text x="24" y="88" font-size="16" font-weight="bold">リージョン</text>
<rect x="30" y="104" width="660" height="574" rx="10" fill="#eef2f7" stroke="#0f766e" stroke-width="2"/>
<text x="46" y="130" font-weight="bold">VPC 例: 10.0.0.0/16</text>
<rect x="210" y="90" width="300" height="34" rx="8" fill="#e1efec" stroke="#0f766e" stroke-width="2"/>
<text x="360" y="112" text-anchor="middle" font-weight="bold">インターネットゲートウェイ(IGW)</text>
<rect x="50" y="150" width="300" height="512" rx="8" fill="#ffffff" stroke="#5a666b" stroke-dasharray="6 4"/>
<rect x="370" y="150" width="300" height="512" rx="8" fill="#ffffff" stroke="#5a666b" stroke-dasharray="6 4"/>
<text x="62" y="172" font-weight="bold">AZ-a</text><text x="658" y="172" font-weight="bold" text-anchor="end">AZ-c</text>
<rect x="66" y="190" width="268" height="160" rx="6" fill="#e1efec" stroke="#0f766e" stroke-width="2"/>
<rect x="66" y="380" width="268" height="120" rx="6" fill="#fdf3e1" stroke="#b45309" stroke-width="2"/>
<rect x="66" y="520" width="268" height="124" rx="6" fill="#fdf3e1" stroke="#b45309" stroke-width="2"/>
<rect x="386" y="190" width="268" height="160" rx="6" fill="#e1efec" stroke="#0f766e" stroke-width="2"/>
<rect x="386" y="380" width="268" height="120" rx="6" fill="#fdf3e1" stroke="#b45309" stroke-width="2"/>
<rect x="386" y="520" width="268" height="124" rx="6" fill="#fdf3e1" stroke="#b45309" stroke-width="2"/>
<text x="78" y="212" font-weight="bold">パブリックサブネット</text>
<text x="78" y="230">例: 10.0.1.0/24</text>
<text x="78" y="308">ルートテーブル</text>
<text x="78" y="326">0.0.0.0/0 → IGW</text>
<text x="78" y="402" font-weight="bold">プライベートサブネット(アプリ)</text>
<text x="78" y="420">例: 10.0.11.0/24</text>
<text x="78" y="446">EC2(アプリ)</text>
<text x="78" y="470">ルートテーブル</text>
<text x="78" y="488">0.0.0.0/0 → NAT ゲートウェイ</text>
<text x="78" y="542" font-weight="bold">プライベートサブネット(DB)</text>
<text x="78" y="560">例: 10.0.21.0/24</text>
<text x="78" y="586">RDS(データベース)</text>
<text x="78" y="610">IGW への経路はありません</text>
<text x="642" y="212" text-anchor="end" font-weight="bold">パブリックサブネット</text>
<text x="642" y="230" text-anchor="end">例: 10.0.2.0/24</text>
<text x="642" y="308" text-anchor="end">ルートテーブル</text>
<text x="642" y="326" text-anchor="end">0.0.0.0/0 → IGW</text>
<text x="642" y="402" text-anchor="end" font-weight="bold">プライベートサブネット(アプリ)</text>
<text x="642" y="420" text-anchor="end">例: 10.0.12.0/24</text>
<text x="642" y="446" text-anchor="end">EC2(アプリ)</text>
<text x="642" y="470" text-anchor="end">ルートテーブル</text>
<text x="642" y="488" text-anchor="end">0.0.0.0/0 → NAT ゲートウェイ</text>
<text x="642" y="542" text-anchor="end" font-weight="bold">プライベートサブネット(DB)</text>
<text x="642" y="560" text-anchor="end">例: 10.0.22.0/24</text>
<text x="642" y="586" text-anchor="end">RDS(データベース)</text>
<text x="642" y="610" text-anchor="end">IGW への経路はありません</text>
<g fill="#ffffff" stroke="#0f766e" stroke-width="2"><rect x="180" y="246" width="130" height="40" rx="6"/><rect x="320" y="246" width="80" height="40" rx="6"/><rect x="410" y="246" width="130" height="40" rx="6"/></g>
<g text-anchor="middle"><text x="245" y="271">NAT ゲートウェイ</text><text x="360" y="271" font-weight="bold">ALB</text><text x="475" y="271">NAT ゲートウェイ</text></g>
<g stroke="#5a666b" stroke-width="2.5" fill="none">
<line x1="245" y1="246" x2="245" y2="126" marker-end="url(#arrow)"/>
<line x1="475" y1="246" x2="475" y2="126" marker-end="url(#arrow)"/>
<line x1="360" y1="124" x2="360" y2="246" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="245" y1="380" x2="245" y2="288" marker-end="url(#arrow)"/>
<line x1="475" y1="380" x2="475" y2="288" marker-end="url(#arrow)"/></g>
<text x="237" y="368" text-anchor="end">外向きの通信</text><text x="483" y="368">外向きの通信</text>
<text x="360" y="716" text-anchor="middle">サブネットは 1 つの AZ に属します。ALB は複数の AZ のパブリックサブネットにまたがって置きます。</text>
<text x="360" y="738" text-anchor="middle">NAT ゲートウェイは AZ ごとに置き、同じ AZ のプライベートサブネットから向けます。</text>
<text x="360" y="760" text-anchor="middle">アプリと DB は別のプライベートサブネットに置きます。</text>
</g>
</svg>
