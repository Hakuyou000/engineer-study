<text x="348" y="375" text-anchor="start" font-size="14" fill="#1c2427">プロジェクトからの指示</text>
<rect x="20" y="392" width="660" height="52" rx="6" fill="#ffffff" stroke="#5a666b" stroke-width="1.5"/>
<text x="350" y="413" text-anchor="middle" font-size="14" fill="#1c2427">この社員は、製造部とプロジェクト A の両方に所属し、2 つの軸から指示を受けます。</text>
<text x="350" y="435" text-anchor="middle" font-size="14" fill="#1c2427">柔軟に連携できる一方、指示が二重になります。</text>
