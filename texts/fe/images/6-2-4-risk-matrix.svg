<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="700" height="450" role="img" aria-labelledby="t">
<title id="t">リスクマトリックスとリスク対応</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a666b"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="15" fill="#1c2427">
<text x="350" y="28" font-size="18" font-weight="bold" text-anchor="middle">リスクマトリックスとリスク対応</text>
<text x="148" y="107.5" text-anchor="end" font-size="16" fill="#1c2427" font-weight="bold">高</text>
<rect x="160" y="60" width="150" height="85" rx="0" fill="#eef2f7" stroke="#5a666b" stroke-width="1.5"/>
<text x="168" y="78" text-anchor="start" font-size="14" fill="#1c2427">レベル 中</text>
<rect x="310" y="60" width="150" height="85" rx="0" fill="#fdf3e1" stroke="#5a666b" stroke-width="1.5"/>
<text x="318" y="78" text-anchor="start" font-size="14" fill="#1c2427">レベル 高</text>
<text x="385.0" y="108" text-anchor="middle" font-size="15" fill="#b45309" font-weight="bold">リスク低減</text>
<text x="385.0" y="128" text-anchor="middle" font-size="14" fill="#1c2427">対策で下げる</text>
<rect x="460" y="60" width="150" height="85" rx="0" fill="#fdf3e1" stroke="#5a666b" stroke-width="1.5"/>
<text x="468" y="78" text-anchor="start" font-size="14" fill="#1c2427">レベル 高</text>
<text x="535.0" y="108" text-anchor="middle" font-size="15" fill="#b45309" font-weight="bold">リスク回避</text>
<text x="535.0" y="128" text-anchor="middle" font-size="14" fill="#1c2427">活動をやめる</text>
<text x="148" y="192.5" text-anchor="end" font-size="16" fill="#1c2427" font-weight="bold">中</text>
<rect x="160" y="145" width="150" height="85" rx="0" fill="#e1efec" stroke="#5a666b" stroke-width="1.5"/>
<text x="168" y="163" text-anchor="start" font-size="14" fill="#1c2427">レベル 低</text>
<rect x="310" y="145" width="150" height="85" rx="0" fill="#eef2f7" stroke="#5a666b" stroke-width="1.5"/>
<text x="318" y="163" text-anchor="start" font-size="14" fill="#1c2427">レベル 中</text>
<rect x="460" y="145" width="150" height="85" rx="0" fill="#fdf3e1" stroke="#5a666b" stroke-width="1.5"/>
<text x="468" y="163" text-anchor="start" font-size="14" fill="#1c2427">レベル 高</text>
<text x="535.0" y="193" text-anchor="middle" font-size="15" fill="#b45309" font-weight="bold">リスク移転</text>
<text x="535.0" y="213" text-anchor="middle" font-size="14" fill="#1c2427">他者と分ける</text>
<text x="148" y="277.5" text-anchor="end" font-size="16" fill="#1c2427" font-weight="bold">低</text>
<rect x="160" y="230" width="150" height="85" rx="0" fill="#e1efec" stroke="#5a666b" stroke-width="1.5"/>
<text x="168" y="248" text-anchor="start" font-size="14" fill="#1c2427">レベル 低</text>
<text x="235.0" y="278" text-anchor="middle" font-size="15" fill="#b45309" font-weight="bold">リスク保有</text>
<text x="235.0" y="298" text-anchor="middle" font-size="14" fill="#1c2427">受容。受け入れる</text>
<rect x="310" y="230" width="150" height="85" rx="0" fill="#e1efec" stroke="#5a666b" stroke-width="1.5"/>
<text x="318" y="248" text-anchor="start" font-size="14" fill="#1c2427">レベル 低</text>
<rect x="460" y="230" width="150" height="85" rx="0" fill="#eef2f7" stroke="#5a666b" stroke-width="1.5"/>
<text x="468" y="248" text-anchor="start" font-size="14" fill="#1c2427">レベル 中</text>
<text x="235.0" y="337" text-anchor="middle" font-size="16" fill="#1c2427" font-weight="bold">小</text>
<text x="385.0" y="337" text-anchor="middle" font-size="16" fill="#1c2427" font-weight="bold">中</text>
<text x="535.0" y="337" text-anchor="middle" font-size="16" fill="#1c2427" font-weight="bold">大</text>
<text x="385.0" y="361" text-anchor="middle" font-size="15" fill="#1c2427" font-weight="bold">影響度(横軸)</text>
<text x="20" y="68" text-anchor="start" font-size="14" fill="#1c2427" font-weight="bold">発生可能性</text>
<text x="20" y="88" text-anchor="start" font-size="14" fill="#1c2427">(縦軸)</text>
<text x="350" y="408" text-anchor="middle" font-size="14" fill="#1c2427">リスクレベルは「発生可能性 × 影響度」で求めます。リスク対応の置き方は一例です</text>
<text x="350" y="430" text-anchor="middle" font-size="14" fill="#1c2427">実際は、リスク基準と比べて、対応が必要かを判断します</text>
</g>
</svg>
