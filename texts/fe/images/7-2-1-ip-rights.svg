<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 390" width="700" height="390" role="img" aria-labelledby="t">
<title id="t">知的財産権の種類</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a666b"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="15" fill="#1c2427">
<text x="350" y="28" font-size="18" font-weight="bold" text-anchor="middle">知的財産権の種類</text>
<rect x="20" y="45" width="660" height="325" rx="10" fill="#eef2f7" stroke="#5a666b" stroke-width="1.5"/>
<text x="40" y="72" text-anchor="start" font-size="16" fill="#1c2427" font-weight="bold">知的財産権</text>
<rect x="40" y="90" width="200" height="265" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
<text x="140" y="125" text-anchor="middle" font-size="16" fill="#0f766e" font-weight="bold">著作権</text>
<text x="140" y="160" text-anchor="middle" font-size="14" fill="#1c2427">創作した時点で</text>
<text x="140" y="182" text-anchor="middle" font-size="14" fill="#1c2427">自動的に発生します</text>
<text x="140" y="214" text-anchor="middle" font-size="14" fill="#1c2427">(登録は不要です)</text>
<rect x="260" y="90" width="400" height="265" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
<text x="460" y="118" text-anchor="middle" font-size="16" fill="#b45309" font-weight="bold">産業財産権</text>
<text x="460" y="142" text-anchor="middle" font-size="14" fill="#1c2427">特許庁に出願し、登録されて初めて発生します</text>
<rect x="275" y="160" width="180" height="85" rx="6" fill="#fdf3e1" stroke="#b45309" stroke-width="1.5"/>
<text x="365" y="186" text-anchor="middle" font-size="15" fill="#1c2427" font-weight="bold">特許法</text>
<text x="365" y="208" text-anchor="middle" font-size="14" fill="#1c2427">発明</text>
<rect x="465" y="160" width="180" height="85" rx="6" fill="#fdf3e1" stroke="#b45309" stroke-width="1.5"/>
<text x="555" y="186" text-anchor="middle" font-size="15" fill="#1c2427" font-weight="bold">実用新案法</text>
<text x="555" y="208" text-anchor="middle" font-size="14" fill="#1c2427">物品の形状や構造に</text>
<text x="555" y="228" text-anchor="middle" font-size="14" fill="#1c2427">関する考案</text>
<rect x="275" y="255" width="180" height="85" rx="6" fill="#fdf3e1" stroke="#b45309" stroke-width="1.5"/>
<text x="365" y="281" text-anchor="middle" font-size="15" fill="#1c2427" font-weight="bold">意匠法</text>
<text x="365" y="303" text-anchor="middle" font-size="14" fill="#1c2427">物品などの形状や模様、</text>
<text x="365" y="323" text-anchor="middle" font-size="14" fill="#1c2427">色彩のデザイン</text>
<rect x="465" y="255" width="180" height="85" rx="6" fill="#fdf3e1" stroke="#b45309" stroke-width="1.5"/>
<text x="555" y="281" text-anchor="middle" font-size="15" fill="#1c2427" font-weight="bold">商標法</text>
<text x="555" y="303" text-anchor="middle" font-size="14" fill="#1c2427">商品やサービスの</text>
<text x="555" y="323" text-anchor="middle" font-size="14" fill="#1c2427">名前、ロゴ</text>
</g>
</svg>
