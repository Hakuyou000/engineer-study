<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" role="img" aria-labelledby="t">
<title id="t">OSPF のマルチアクセスでの DR、BDR、DROTHER の隣接</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a666b"/></marker></defs>
<g font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="14" fill="#1c2427">
<rect x="20" y="16" width="660" height="330" rx="10" fill="#eef2f7" stroke="#5a666b"/>
<text x="36" y="42" font-size="16" font-weight="bold">イーサネットのセグメント(多数のルーターがつながる)</text>
<g stroke="#0f766e" stroke-width="3">
<line x1="300" y1="110" x2="400" y2="110"/>
<line x1="160" y1="142" x2="160" y2="268"/>
<line x1="540" y1="142" x2="540" y2="268"/>
<line x1="250" y1="142" x2="440" y2="268"/>
<line x1="450" y1="142" x2="260" y2="268"/>
</g>
<line x1="300" y1="300" x2="400" y2="300" stroke="#b45309" stroke-width="3" stroke-dasharray="8 6"/>
<g fill="#ffffff" stroke="none">
<rect x="326" y="96" width="48" height="20"/><rect x="170" y="195" width="40" height="20"/><rect x="490" y="195" width="40" height="20"/>
<rect x="300" y="158" width="40" height="20"/><rect x="360" y="158" width="40" height="20"/>
<rect x="318" y="286" width="64" height="20"/>
</g>
<g text-anchor="middle" fill="#0f766e" font-weight="bold">
<text x="350" y="111">Full</text><text x="190" y="210">Full</text><text x="510" y="210">Full</text>
<text x="320" y="173">Full</text><text x="380" y="173">Full</text>
</g>
<text x="350" y="301" text-anchor="middle" fill="#b45309" font-weight="bold">2-Way</text>
<g stroke="#0f766e" stroke-width="2">
<rect x="120" y="76" width="180" height="66" rx="8" fill="#e1efec"/>
<rect x="400" y="76" width="180" height="66" rx="8" fill="#e1efec"/>
</g>
<g stroke="#5a666b" stroke-width="2">
<rect x="120" y="268" width="180" height="66" rx="8" fill="#fdf3e1"/>
<rect x="400" y="268" width="180" height="66" rx="8" fill="#fdf3e1"/>
</g>
<g text-anchor="middle">
<text x="210" y="104" font-size="16" font-weight="bold">R1</text><text x="210" y="127">DR(代表)</text>
<text x="490" y="104" font-size="16" font-weight="bold">R2</text><text x="490" y="127">BDR(予備)</text>
<text x="210" y="296" font-size="16" font-weight="bold">R3</text><text x="210" y="319">DROTHER</text>
<text x="490" y="296" font-size="16" font-weight="bold">R4</text><text x="490" y="319">DROTHER</text>
</g>
<line x1="40" y1="380" x2="90" y2="380" stroke="#0f766e" stroke-width="3"/>
