<line x1="300" y1="380" x2="350" y2="380" stroke="#b45309" stroke-width="3" stroke-dasharray="8 6"/>
<text x="360" y="385">点線 = 2-Way(DROTHER どうしでは正常)</text>
<rect x="20" y="404" width="660" height="52" rx="8" fill="#fdf3e1" stroke="#b45309"/>
<text x="36" y="426">DROTHER の更新は 224.0.0.6(DR / BDR あて)に送ります。</text>
<text x="36" y="446">DR は 224.0.0.5 で全員に配ります。</text>
